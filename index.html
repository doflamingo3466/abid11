<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>.dot — Everyday objects, considered</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <nav class="navbar py-3">
    <div class="container">
      <a class="navbar-brand brand" href="#">.dot</a>
      <span class="eyebrow">Objects for everyday</span>
      <a class="btn btn-dark btn-sm" href="#cart">Bag <span id="count">0</span></a>
    </div>
  </nav>

  <main class="container py-5">
    <section class="hero p-4 p-md-5 d-flex justify-content-between align-items-end mb-5">
      <div>
        <p class="eyebrow">Small things, better days</p>
        <h1>Good things<br>in good form.</h1>
        <p>Thoughtful essentials for your everyday rituals.</p>
      </div>
      <div class="hero-mark">.d</div>
    </section>

    <div class="row g-4">
      <section class="col-lg-9">
        <p class="eyebrow mb-1">The collection</p>
        <h2 class="h3 fw-bold mb-3">Everyday favorites</h2>
        <div id="products" class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-3"></div>
      </section>

      <aside class="col-lg-3" id="cart">
        <div class="cart-box p-4 sticky-top">
          <p class="eyebrow mb-1">Your selection</p>
          <h2 class="h4 fw-bold">Shopping bag <span id="bag-label">(0)</span></h2>
          <div id="items" class="small text-secondary mb-3">Your bag is empty.</div>
          <div class="d-flex justify-content-between border-top pt-3 fw-bold">
            <span>Total</span><span id="total">PKR 0</span>
          </div>
          <button id="continue" class="btn btn-dark w-100 mt-3">Continue</button>
          <button id="clear" class="btn btn-outline-dark w-100 mt-2">Clear bag</button>
        </div>
      </aside>
    </div>
  </main>

  <footer class="container py-4 d-flex justify-content-between small">
    <span class="brand">.dot</span><span>Made for the everyday.</span><span>© 2026</span>
  </footer>
</body>
</html>
